<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c3483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a569bd;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="8" fill="none" stroke="#e8c97a" stroke-width="0.6" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#pattern)"/>
  <text x="400" y="290" font-family="serif" font-size="72" fill="#e8c97a" text-anchor="middle" opacity="0.9">بندری</text>
  <text x="400" y="360" font-family="serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.7">Bandari Traditional Costume</text>
  <rect x="150" y="400" width="500" height="3" fill="#e8c97a" opacity="0.5"/>
