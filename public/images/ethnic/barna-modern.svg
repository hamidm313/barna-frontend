<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e70;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern" x="0" y="0" width="70" height="70" patternUnits="userSpaceOnUse">
      <circle cx="35" cy="35" r="25" fill="none" stroke="#C9A84C" stroke-width="0.6" opacity="0.2"/>
      <circle cx="35" cy="35" r="10" fill="none" stroke="#C9A84C" stroke-width="0.6" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#pattern)"/>
  <text x="400" y="270" font-family="serif" font-size="60" fill="#C9A84C" text-anchor="middle" opacity="0.9">مدرن برنا</text>
  <text x="400" y="350" font-family="serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.7">Barna Modern Collection</text>
  <rect x="150" y="390" width="500" height="3" fill="#C9A84C" opacity="0.5"/>
